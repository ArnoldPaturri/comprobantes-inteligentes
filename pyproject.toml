[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-comprobantes"
version = "0.2.0"
description = "Aplicación modular para analizar y conciliar cotizaciones, facturas, boletas y pagos mediante IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.20,<6",
    "openpyxl>=3.1.5,<4",
    "Pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
agente-comprobantes = "agente_comprobantes.consola:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["pruebas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
